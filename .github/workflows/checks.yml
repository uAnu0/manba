name: Review regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  direct-matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_readiness.py -q
      - run: node tests/frontend_regressions.cjs
      - run: python -m evals.eval_golden
      - run: python -m evals.eval_fiqh
      - run: python -m evals.eval_translations
