<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manba test console</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f27; --muted: #667085; --line: #e3e6ec;
    --ok: #137a4b; --ok-bg: #e4f6ec; --warn: #9a6200; --warn-bg: #fff3d6; --bad: #b42318; --bad-bg: #fde8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12141a; --card: #1b1e26; --text: #e8eaf0; --muted: #9aa3b2; --line: #2b303b;
      --ok: #5fd39a; --ok-bg: #123424; --warn: #f2c14e; --warn-bg: #3a2e10; --bad: #ff8a80; --bad-bg: #3d1a17; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  textarea { width: 100%; min-height: 150px; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); font: 20px/1.8 "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 20px; }
  button { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: inherit; }
  button.primary { background: #3b5bdb; border-color: #3b5bdb; color: #fff; }
  button:disabled { opacity: .6; cursor: wait; }
  .samples { display: flex; gap: 6px; flex-wrap: wrap; }
  .samples button { font-size: 13px; padding: 5px 10px; }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
  .chip { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .chip.verified { background: var(--ok-bg); color: var(--ok); }
  .chip.semantic_variant { background: var(--warn-bg); color: var(--warn); }
  .chip.baseless { background: var(--bad-bg); color: var(--bad); }
  .chip.plain { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .seg { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .seg.verified { border-left-color: var(--ok); } .seg.semantic_variant { border-left-color: var(--warn); } .seg.baseless { border-left-color: var(--bad); }
  .seg .top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .ar { direction: rtl; text-align: right; font: 22px/1.9 "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif; }
  .label { color: var(--muted); font-size: 12px; margin: 10px 0 2px; text-transform: uppercase; letter-spacing: .04em; }
  .src { font-size: 14px; } .src b { font-weight: 600; }
  ul.diff { margin: 4px 0 0; padding-left: 20px; direction: rtl; text-align: right; } ul.diff li { margin: 2px 0; }
  details { margin-top: 16px; } pre { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; direction: ltr; text-align: left; font-size: 12px; }
  .note-line { color: var(--muted); font-size: 13px; border-left: 3px solid var(--line); padding: 4px 12px; margin: 0 0 12px; }
  .note-line .ar { font-size: 16px; line-height: 1.7; }
  .err { background: var(--bad-bg); color: var(--bad); padding: 10px 14px; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Manba test console</h1>
  <p class="sub">Testing only. Sends your text to <code>POST /api/verify</code> and shows each segment's result.</p>

  <textarea id="text" dir="rtl" placeholder="الصق النص هنا… (paste Arabic text here)"></textarea>
  <div class="row">
    <button id="go" class="primary">Verify</button>
    <button id="clear">Clear</button>
    <label class="sub" style="margin:0"><input type="checkbox" id="llm"> Use LLM claim extraction</label>
    <span class="sub" id="timing" style="margin:0"></span>
  </div>
  <div class="samples" id="samples"></div>

  <div id="out" style="margin-top:20px"></div>
  <details id="rawbox" hidden><summary>Raw JSON response</summary><pre id="raw"></pre></details>
</main>

<script>
const SAMPLES = [
  ["Exact verse", "الحمد لله رب العالمين"],
  ["Multi-verse", "قل هو الله أحد الله الصمد لم يلد ولم يولد"],
  ["Partial quote", "على هدى من ربهم"],
  ["Altered verse", "قل هو الله أحد الله الواحد"],
  ["Negation removed", "إن الله يغفر أن يشرك به ويغفر ما دون ذلك لمن يشاء"],
  ["Not Quran", "النظافة من الإيمان"],
  ["Mixed text", "قال الإمام في خطبته اليوم. إن مع العسر يسرا. ثم تحدث عن الصبر. ولا تقربوا الزنى إنه كان فاحشة."],
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS_LABEL = { verified: "Verified", semantic_variant: "Variant", baseless: "Baseless" };

for (const [name, text] of SAMPLES) {
  const b = document.createElement("button");
  b.textContent = name;
  b.onclick = () => { $("text").value = text; run(); };
  $("samples").appendChild(b);
}

function render(data) {
  const counts = {};
  const claims = data.segments.filter(s => s.is_claim !== false);
  for (const s of claims) counts[s.status] = (counts[s.status] || 0) + 1;
  const quiet = data.segments.length - claims.length;
  let html = `<div class="summary"><span>${data.word_count} words</span><span>${claims.length} claim(s)</span>` +
    Object.entries(counts).map(([k, v]) => `<span class="chip ${k}">${v} ${STATUS_LABEL[k]}</span>`).join("") +
    (quiet ? `<span class="chip plain">${quiet} commentary</span>` : "") + `</div>`;

  for (const s of data.segments) {
    if (s.is_claim === false) {
      html += `<div class="note-line"><span class="label" style="margin:0">Commentary, no claim found</span><div class="ar">${esc(s.segment_text)}</div></div>`;
      continue;
    }
    html += `<div class="seg ${s.status}"><div class="top">
      <span class="chip ${s.status}">${STATUS_LABEL[s.status]}</span>
      <span class="chip plain">${esc(s.classification)}</span>
      ${s.status === "verified" ? `<span class="chip plain">${esc(s.match_type)} match</span>` : ""}
      <span class="chip plain">confidence ${Number(s.confidence).toFixed(2)}</span></div>
      <div class="ar">${esc(s.segment_text)}</div>`;
    if (s.source) {
      const o = s.source.other_matches_count;
      html += `<div class="label">Source</div><div class="src"><b>${esc(s.source.chapter)}</b> ${s.source.number ? `&middot; ${esc(s.source.number)} ` : ""}&middot; ${esc(s.source.book)}` +
        (o ? ` <span class="chip plain">+${o} other match${o > 1 ? "es" : ""}</span>` : "") + `</div>` +
        `<div class="label">${s.status === "verified" ? "Matched text" : "Closest text"}</div><div class="ar">${esc(s.source.matched_text.length > 600 ? s.source.matched_text.slice(0, 600) + " …" : s.source.matched_text)}</div>`;
    }
    if (s.differences && s.differences.length) {
      html += `<div class="label">Differences</div><ul class="diff">${s.differences.map(d => `<li>${esc(d)}</li>`).join("")}</ul>`;
    }
    html += `</div>`;
  }
  const x = data.extraction;
  if (x) {
    html = `<div class="seg ${x.used ? "" : "baseless"}"><div class="top"><span class="chip plain">LLM extraction</span>
      <span class="chip plain">${x.used ? `${x.claims_accepted} of ${x.claims_found} claims used` : "not used"}</span></div>` +
      (x.error ? `<div class="err">${esc(x.error)}</div>` : "") +
      (x.rejected.length ? `<div class="label">Rejected (not found in your text)</div><ul class="diff">${x.rejected.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : "") +
      `</div>` + html;
  }
  $("out").innerHTML = html;
}

async function run() {
  const text = $("text").value.trim();
  if (!text) return;
  $("go").disabled = true; $("out").innerHTML = ""; $("timing").textContent = "";
  const t0 = performance.now();
  try {
    const res = await fetch("/api/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, use_llm: $("llm").checked }) });
    const data = await res.json();
    $("timing").textContent = `${Math.round(performance.now() - t0)} ms`;
    if (!res.ok) throw new Error(JSON.stringify(data));
    render(data);
    $("raw").textContent = JSON.stringify(data, null, 2); $("rawbox").hidden = false;
  } catch (e) {
    $("out").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally { $("go").disabled = false; }
}

$("go").onclick = run;
$("clear").onclick = () => { $("text").value = ""; $("out").innerHTML = ""; $("rawbox").hidden = true; $("timing").textContent = ""; };
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run(); });
</script>
</body>
</html>
