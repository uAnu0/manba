<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manba evidence finder</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f27; --muted: #667085; --line: #e3e6ec;
    --ok: #137a4b; --ok-bg: #e4f6ec; --warn: #9a6200; --warn-bg: #fff3d6; --bad: #b42318; --bad-bg: #fde8e6; --gray-bg: #eceff4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12141a; --card: #1b1e26; --text: #e8eaf0; --muted: #9aa3b2; --line: #2b303b;
      --ok: #5fd39a; --ok-bg: #123424; --warn: #f2c14e; --warn-bg: #3a2e10; --bad: #ff8a80; --bad-bg: #3d1a17; --gray-bg: #262a33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 24px 0 8px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; } a { color: inherit; }
  textarea { width: 100%; min-height: 76px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font: 18px/1.7 system-ui, "Noto Naskh Arabic", serif; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0 12px; }
  button { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: inherit; }
  button.primary { background: #3b5bdb; border-color: #3b5bdb; color: #fff; } button:disabled { opacity: .6; cursor: wait; }
  .samples { display: flex; gap: 6px; flex-wrap: wrap; } .samples button { font-size: 13px; padding: 5px 10px; }
  .banner { border-radius: 10px; padding: 12px 14px; margin: 14px 0; }
  .banner.refer { background: var(--warn-bg); color: var(--warn); } .banner.notice { background: var(--gray-bg); color: var(--muted); font-size: 13px; }
  .banner b { display: block; margin-bottom: 2px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .ar { direction: rtl; text-align: right; font: 21px/1.9 "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .chip { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--gray-bg); color: var(--muted); white-space: nowrap; }
  .chip.sahih { background: var(--ok-bg); color: var(--ok); } .chip.hasan { background: var(--warn-bg); color: var(--warn); } .chip.daif { background: var(--bad-bg); color: var(--bad); }
  .src { font-weight: 600; } details { margin-top: 6px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .err { background: var(--bad-bg); color: var(--bad); padding: 10px 14px; border-radius: 8px; }
  .small { font-size: 12px; color: var(--muted); } input[type=password] { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Evidence finder <span class="small">(test)</span></h1>
  <p class="sub">Ask about a topic. You get Quran verses and hadith that bear on it, with sources and scholars' gradings. It is not a ruling. <a href="/">Back to the quote verifier</a></p>

  <textarea id="q" dir="auto" placeholder="مثال: ما حكم الرشوة؟   Example: What is the evidence on honouring parents?"></textarea>
  <div class="row">
    <button id="go" class="primary">Find evidence</button>
    <label class="small"><input type="checkbox" id="meaning" checked> Meaning search (embeddings)</label>
    <label class="small"><input type="checkbox" id="llm"> LLM recall (slower; every text is checked against the corpus)</label>
  </div>
  <div class="samples" id="samples"></div>

  <details id="settings" style="margin:14px 0"><summary>Settings <span class="small" id="cfgnote"></span></summary>
    <div style="display:grid; gap:8px; margin-top:8px">
      <label class="small">Access code (only if the server asks)<input id="token" type="password" autocomplete="off"></label>
      <label class="small">Your OpenRouter key (only if the server has no shared key)<input id="orkey" type="password" autocomplete="off" placeholder="sk-or-v1-..."></label>
    </div>
  </details>

  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
for (const q of ["ما حكم الرشوة؟", "ما فضل بر الوالدين؟", "كيف أتوب من الذنوب؟", "ما حكم الاحتكار؟", "What is the evidence about backbiting?", "ما حكم الطلاق في الغضب؟"]) {
  const b = document.createElement("button"); b.textContent = q; b.onclick = () => { $("q").value = q; run(); }; $("samples").appendChild(b);
}
function gradeClass(g) { g = g.toLowerCase(); return g.includes("daif") || g.includes("weak") || g.includes("mawdu") || g.includes("munkar") ? "daif" : g.includes("sahih") ? "sahih" : g.includes("hasan") ? "hasan" : ""; }
function renderItem(it) {
  const s = it.source;
  const grades = (s.grades || []).map(g => `<span class="chip ${gradeClass(g.grade)}">${esc(g.grade)} <span style="font-weight:400">· ${esc(g.name)}</span></span>`).join("");
  const where = [s.book, s.chapter && it.classification === "hadith" ? s.chapter : (it.classification === "quran" ? s.chapter : ""), s.number].filter(Boolean).join(" · ");
  const full = it.full_text && it.full_text !== s.matched_text ? `<details><summary>${it.classification === "hadith" ? "Full text with chain of narrators" : "Full text"}</summary><div class="ar">${esc(it.full_text)}</div></details>` : "";
  return `<div class="item"><div class="meta"><span class="src">${esc(where)}</span>${grades}
    ${(it.found_by || []).map(f => `<span class="chip">${{ meaning: "by meaning" + (it.similarity ? " " + it.similarity.toFixed(2) : ""), keyword: "keywords", suggestion: "recalled by LLM, found in corpus" }[f]}</span>`).join("")}
    ${it.relevance ? `<span class="chip ${it.relevance === "direct" ? "sahih" : "hasan"}">${it.relevance === "direct" ? "direct evidence" : "related"} (AI judged)</span>` : ""}
    ${it.exact_wording ? "" : `<span class="chip warn">close wording, not identical</span>`}</div>
    <div class="ar">${esc(s.matched_text)}</div>${full}</div>`;
}
function render(d) {
  let h = "";
  if (d.in_scope === false) h += `<div class="banner refer"><b>Outside the scope</b>${esc(d.reason || "")}</div>`;
  if (d.refer_to_scholar) h += `<div class="banner refer"><b>Please ask a qualified scholar</b>${esc(d.reason || "")}</div>`;
  h += `<div class="banner notice" dir="auto"><b>${esc(d.notice_en)}</b><span dir="rtl" style="display:block;margin-top:4px">${esc(d.notice_ar)}</span></div>`;
  if (d.query && d.query.meaning_error) h += `<div class="err" style="margin-top:8px">Meaning search failed: ${esc(d.query.meaning_error)}</div>`;
  if (d.query && d.query.used) h += `<div class="small">LLM recalled ${d.query.suggested} texts; ${d.query.found_in_corpus} found in the corpus${d.query.rejected.length ? `, ${d.query.rejected.length} not found and discarded` : ""}.</div>`;
  if (d.query && d.query.error) h += `<div class="err" style="margin-top:8px">${esc(d.query.error)}</div>`;
  h += `<h2>Quran (${d.quran.length})</h2>` + (d.quran.map(renderItem).join("") || `<div class="small">No verse found.</div>`);
  h += `<h2>Hadith (${d.hadith.length})</h2>` + (d.hadith.map(renderItem).join("") || `<div class="small">No hadith found.</div>`);
  $("out").innerHTML = h;
}
async function run() {
  const question = $("q").value.trim(); if (!question) return;
  $("go").disabled = true; $("out").innerHTML = `<div class="small">Searching…</div>`;
  const headers = { "Content-Type": "application/json" };
  if ($("token").value) headers["X-Access-Token"] = $("token").value;
  if ($("orkey").value) headers["X-OpenRouter-Key"] = $("orkey").value;
  try {
    const res = await fetch("/api/evidence", { method: "POST", headers, body: JSON.stringify({ question, use_llm: $("llm").checked, use_meaning: $("meaning").checked }) });
    if (res.status === 401) { $("settings").open = true; throw new Error("The server needs an access code: enter it in Settings."); }
    const data = await res.json(); if (!res.ok) throw new Error(JSON.stringify(data));
    render(data);
  } catch (e) { $("out").innerHTML = `<div class="err">${esc(e.message)}</div>`; } finally { $("go").disabled = false; }
}
for (const [id, key] of [["token", "manba_access_token"], ["orkey", "manba_openrouter_key"]]) {
  try { $(id).value = localStorage.getItem(key) || ""; } catch (e) {}
  $(id).addEventListener("change", () => { try { localStorage.setItem(key, $(id).value); } catch (e) {} });
}
fetch("/api/config").then(r => r.json()).then(c => {
  $("cfgnote").textContent = "(" + [c.access_required ? "access code required" : null, c.server_has_llm_key ? "server has a shared LLM key" : "no server LLM key"].filter(Boolean).join(", ") + ")";
  if (c.access_required && !$("token").value) $("settings").open = true;
}).catch(() => {});
$("go").onclick = run;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run(); });
</script>
</body>
</html>
